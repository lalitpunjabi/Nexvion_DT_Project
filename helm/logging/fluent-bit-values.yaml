# Fluent Bit Staging Helm / Declarative Configuration Values
# Target: DaemonSet log collector enriching Kubernetes pod logs & forwarding to Elasticsearch

kind: DaemonSet

# Resource requests and limits
resources:
  requests:
    cpu: "20m"
    memory: "30Mi"
  limits:
    cpu: "100m"
    memory: "64Mi"

# Service account & RBAC
serviceAccount:
  create: true
  name: fluent-bit

# Log forwarding backend target
backend:
  type: es
  es:
    host: "elasticsearch.logging.svc.cluster.local"
    port: 9200
    logstashPrefix: "nexvion-logs"
    logstashFormat: true
    suppressTypeName: true
    replaceDots: true

# Kubernetes metadata filter enabled
env:
  - name: KUBERNETES_SERVICE_HOST
    value: "kubernetes.default.svc"
