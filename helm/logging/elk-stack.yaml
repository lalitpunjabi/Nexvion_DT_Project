apiVersion: apps/v1
kind: Deployment
metadata:
  name: elk
  namespace: logging
  labels:
    app: elk
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: elk
  template:
    metadata:
      labels:
        app: elk
    spec:
      containers:
      - name: elasticsearch
        image: docker.elastic.co/elasticsearch/elasticsearch:7.17.18
        env:
        - name: discovery.type
          value: "single-node"
        - name: ES_JAVA_OPTS
          value: "-Xms128m -Xmx128m"
        - name: xpack.security.enabled
          value: "false"
        - name: xpack.monitoring.enabled
          value: "false"
        ports:
        - containerPort: 9200
          name: http
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 300m
            memory: 512Mi
        readinessProbe:
          httpGet:
            path: /_cluster/health
            port: 9200
          initialDelaySeconds: 15
          periodSeconds: 5
      - name: kibana
        image: docker.elastic.co/kibana/kibana:7.17.18
        env:
        - name: ELASTICSEARCH_HOSTS
          value: "http://127.0.0.1:9200"
        - name: SERVER_HOST
          value: "0.0.0.0"
        - name: XPACK_SECURITY_ENABLED
          value: "false"
        - name: NODE_OPTIONS
          value: "--max-old-space-size=256"
        ports:
        - containerPort: 5601
          name: ui
        resources:
          requests:
            cpu: 50m
            memory: 160Mi
          limits:
            cpu: 200m
            memory: 384Mi
        readinessProbe:
          httpGet:
            path: /api/status
            port: 5601
          initialDelaySeconds: 20
          periodSeconds: 10
          timeoutSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: elasticsearch
  namespace: logging
  labels:
    app: elk
spec:
  type: ClusterIP
  publishNotReadyAddresses: true
  ports:
  - port: 9200
    targetPort: 9200
    name: http
  selector:
    app: elk
---
apiVersion: v1
kind: Service
metadata:
  name: kibana
  namespace: logging
  labels:
    app: elk
spec:
  type: ClusterIP
  ports:
  - port: 5601
    targetPort: 5601
    name: ui
  selector:
    app: elk
