# AWS EKS Overrides for the staging deployment
# IMPORTANT: ECR repository URI and Git SHA tag will be supplied dynamically during Phase 4.4 / EKS deployment.

namespace: nexvion

replicaCount: 2

image:
  # Real AWS ECR repository URI created in Phase 4.3
  repository: "677012863109.dkr.ecr.ap-south-1.amazonaws.com/nexvion-web"
  # Dynamic Git SHA commit tag (supplied at deploy time via --set image.tag=${GIT_SHA})
  tag: "<git-sha>"
  pullPolicy: Always

config:
  environment: "staging"
  logLevel: "warn"

ingress:
  enabled: true
  # Update className according to the active EKS ingress controller.
  className: nginx
  host: nexvion.example.com
  path: /
  pathType: Prefix

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi
