apiVersion: v1
kind: Secret
metadata:
  name: {{ include "nexvion-web.fullname" . }}-secret
  namespace: {{ .Values.namespace | default "nexvion" }}
  labels:
    {{- include "nexvion-web.labels" . | nindent 4 }}
type: Opaque
# Safe placeholder values for local manifest & chart validation.
# IMPORTANT: Secrets must be injected securely via CI/CD, External Secrets Operator, or AWS Secrets Manager.
stringData:
  API_KEY_PLACEHOLDER: {{ .Values.secrets.apiKeyPlaceholder | quote }}
  SESSION_SECRET_PLACEHOLDER: {{ .Values.secrets.sessionSecretPlaceholder | quote }}
