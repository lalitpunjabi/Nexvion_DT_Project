---
- name: Enable TCP SYN flood protection via sysctl
  ansible.posix.sysctl:
    name: net.ipv4.tcp_syncookies
    value: '1'
    sysctl_set: yes
    state: present
    reload: yes

- name: Restrict ICMP redirects via sysctl
  ansible.posix.sysctl:
    name: net.ipv4.conf.all.accept_redirects
    value: '0'
    sysctl_set: yes
    state: present
    reload: yes

- name: Configure UFW firewall default incoming policy
  community.general.ufw:
    direction: incoming
    policy: deny
  ignore_errors: true

- name: Configure UFW firewall default outgoing policy
  community.general.ufw:
    direction: outgoing
    policy: allow
  ignore_errors: true

- name: Allow required application and management ports in UFW
  community.general.ufw:
    rule: allow
    port: "{{ item }}"
    proto: tcp
  loop: "{{ allowed_tcp_ports }}"
  ignore_errors: true

- name: Enable UFW firewall service
  community.general.ufw:
    state: enabled
  ignore_errors: true
