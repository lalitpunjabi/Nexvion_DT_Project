---
- name: Gather package facts to detect existing Jenkins installation
  ansible.builtin.package_facts:
    manager: auto

- name: Install Java JDK prerequisite
  ansible.builtin.apt:
    name: "{{ java_package }}"
    state: present
    update_cache: yes

- name: Add Jenkins repository GPG key
  ansible.builtin.get_url:
    url: https://pkg.jenkins.io/debian-stable/jenkins.io-2023.key
    dest: /usr/share/keyrings/jenkins-keyring.asc
    mode: '0644'
  when: "'jenkins' not in ansible_facts.packages"

- name: Install Jenkins service package
  ansible.builtin.apt:
    name: jenkins
    state: present
    update_cache: yes
  when: "'jenkins' not in ansible_facts.packages"

- name: Ensure Jenkins user is in docker group
  ansible.builtin.user:
    name: jenkins
    groups: docker
    append: yes

- name: Ensure Jenkins service is enabled and running
  ansible.builtin.service:
    name: jenkins
    state: started
    enabled: yes
