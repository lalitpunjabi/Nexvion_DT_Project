apiVersion: v1
kind: Service
metadata:
  name: nexvion-web-service
  namespace: nexvion
  labels:
    app: nexvion-web
    app.kubernetes.io/name: nexvion-web
    app.kubernetes.io/component: service
    app.kubernetes.io/part-of: nexvion-platform
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: 80
      protocol: TCP
  selector:
    app: nexvion-web
