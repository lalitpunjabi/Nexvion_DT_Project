apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nexvion-web-ingress
  namespace: nexvion
  labels:
    app: nexvion-web
    app.kubernetes.io/name: nexvion-web
    app.kubernetes.io/component: ingress
    app.kubernetes.io/part-of: nexvion-platform
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  rules:
    - host: nexvion.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nexvion-web-service
                port:
                  number: 80
