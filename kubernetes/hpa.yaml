apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: nexvion-web-hpa
  namespace: nexvion
  labels:
    app: nexvion-web
    app.kubernetes.io/name: nexvion-web
    app.kubernetes.io/component: autoscaler
    app.kubernetes.io/part-of: nexvion-platform
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: nexvion-web
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
